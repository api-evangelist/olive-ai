aid: olive-ai
name: Olive AI
description: >-
  Olive AI was a Columbus, Ohio healthcare automation company founded in 2012
  by Sean Lane (originally as CrossChx, rebranded to Olive in 2017). The
  company built robotic process automation (RPA), AI, and workflow tooling
  aimed at the healthcare revenue cycle — including a "digital workforce"
  marketed as "Olive" that automated repetitive administrative tasks in
  hospitals and health systems. Olive's portfolio centered on clearinghouse
  and patient access automation, prior authorization automation, claims
  status checks, eligibility verification, and process mining for
  revenue-cycle optimization. At its peak Olive raised more than $900M and
  reached a $4B valuation, but a series of strategic missteps, layoffs, and
  cash burn forced an orderly wind-down. In late 2023 Olive sold its
  clearinghouse and patient access business to Waystar, and in early 2024
  sold its prior authorization business to Humata Health, then ceased
  operations. The Olive AI brand is no longer active and there is no public
  developer API, SDK, or open-source release; surviving capabilities live
  on inside Waystar and Humata Health.
